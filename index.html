<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dziesięć Działań</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one centered card on squared notebook paper (zeszyt w kratkę): level pick → 10 tasks → report */
:root {
  --paper: #f7f9fc;
  --grid: #d6e2f0;
  --card: #ffffff;
  --ink: #1d2a44;
  --muted: #5d6b85;
  --accent: #2f6fdb;
  --accent-ink: #ffffff;
  --good: #1f9d5a;
  --good-bg: #e3f6ec;
  --bad: #d64545;
  --bad-bg: #fde8e8;
  --line: #e2e8f2;
  --margin-red: #f2a3a3;
  --lv-easy: #2e9e62;
  --lv-mid: #2f6fdb;
  --lv-hard: #7a4fd1;
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a28; --grid: #1f2a3e; --card: #1a2335; --ink: #e8eef9; --muted: #9aa8c2;
    --accent: #6a9cf5; --accent-ink: #0d1424; --good: #4fd18e; --good-bg: #173327;
    --bad: #f07a7a; --bad-bg: #3a1d22; --line: #2a3650; --margin-red: #6b3340;
    --lv-easy: #4fd18e; --lv-mid: #6a9cf5; --lv-hard: #a98af0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a28; --grid: #1f2a3e; --card: #1a2335; --ink: #e8eef9; --muted: #9aa8c2;
  --accent: #6a9cf5; --accent-ink: #0d1424; --good: #4fd18e; --good-bg: #173327;
  --bad: #f07a7a; --bad-bg: #3a1d22; --line: #2a3650; --margin-red: #6b3340;
  --lv-easy: #4fd18e; --lv-mid: #6a9cf5; --lv-hard: #a98af0; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  padding-inline: 16px;
  padding-block: 32px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 2rem; margin: 0; line-height: 1.1; text-wrap: balance; }
h1 span { color: var(--accent); }
h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; margin: 0 0 14px; }
.chip { font-weight: 800; font-size: .85rem; padding: 4px 12px; border-radius: 999px; color: var(--card); background: var(--lv); }

.card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 20px;
  padding: 24px 24px 24px 36px;
  position: relative;
  box-shadow: 0 6px 0 var(--line);
}
.card::before { content: ""; position: absolute; left: 18px; top: 0; bottom: 0; width: 2px; background: var(--margin-red); }

/* Level picker */
.levels { display: grid; gap: 12px; }
.level {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; text-align: left;
  background: var(--paper); color: var(--ink); border: 3px solid var(--lv); border-radius: 16px;
  padding: 12px 16px; box-shadow: 0 4px 0 var(--lv); font-family: var(--f-body);
}
.level:active { box-shadow: 0 1px 0 var(--lv); }
.level .bars { grid-row: span 2; display: flex; gap: 3px; align-items: flex-end; height: 28px; }
.level .bars i { width: 7px; border-radius: 2px; background: var(--line); }
.level .bars i:nth-child(1) { height: 40%; } .level .bars i:nth-child(2) { height: 70%; } .level .bars i:nth-child(3) { height: 100%; }
.level .bars i.on { background: var(--lv); }
.level b { font-family: var(--f-display); font-size: 1.4rem; line-height: 1; color: var(--lv); }
.level small { font-size: .9rem; color: var(--muted); font-weight: 600; }

.shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.shelf .spot { text-align: center; min-width: 0; }
.shelf svg { width: 100%; height: auto; }
.shelf .spot.locked svg { filter: grayscale(1); opacity: .22; }
.shelf .cap { font-size: .8rem; font-weight: 800; color: var(--muted); }
.shelf .spot:not(.locked) .cap { color: var(--ink); }

.progress { display: flex; gap: 6px; margin-bottom: 18px; }
.dot { flex: 1; height: 10px; border-radius: 5px; background: var(--line); transition: background .25s; }
.dot.now { background: var(--accent); }
.dot.ok { background: var(--good); }
.dot.no { background: var(--bad); }
.count, .pen-title { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; }

.task {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(2.2rem, 10vw, 3.6rem);
  line-height: 1.1; margin: 10px 0 18px;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: center; flex-wrap: wrap; gap: .22em;
}
.task .op { color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.inbox { flex: 1 1 180px; min-width: 0; display: flex; gap: 8px; }
#answer {
  flex: 1; min-width: 0;
  font-family: var(--f-display); font-weight: 700; font-size: 2rem;
  padding: 8px 16px; border-radius: 14px;
  border: 3px solid var(--line); background: var(--paper); color: var(--ink);
  font-variant-numeric: tabular-nums;
}
#answer:focus { outline: none; border-color: var(--accent); }
#answer.ok { border-color: var(--good); }
#answer.no { border-color: var(--bad); }
button {
  font-family: var(--f-display); font-weight: 700; font-size: 1.25rem;
  border: 0; border-radius: 14px; padding: 12px 26px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000);
  transition: transform .08s, box-shadow .08s;
}
button:active { transform: translateY(3px); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }

.feedback { margin-top: 16px; padding: 12px 16px; border-radius: 14px; font-weight: 800; font-size: 1.1rem; }
.feedback.ok { background: var(--good-bg); color: var(--good); }
.feedback.no { background: var(--bad-bg); color: var(--bad); }
.hint { font-size: .85rem; color: var(--muted); margin-top: 12px; }
.err { color: var(--bad); font-size: .9rem; margin-top: 8px; font-weight: 600; }

.score { font-family: var(--f-display); font-weight: 800; font-size: clamp(3.5rem, 18vw, 5rem); line-height: 1; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.score small { font-size: .45em; color: var(--muted); }
.msg { font-size: 1.2rem; font-weight: 800; margin: 0 0 18px; }
.list { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 6px; }
.list li { display: grid; grid-template-columns: 1.6em 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; font-variant-numeric: tabular-nums; }
.list li.ok { background: var(--good-bg); }
.list li.no { background: var(--bad-bg); }
.list .mark { font-weight: 800; font-size: 1.1rem; }
.list li.ok .mark { color: var(--good); }
.list li.no .mark { color: var(--bad); }
.list .eq { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; min-width: 0; }
.list .yours { font-size: .85rem; color: var(--muted); text-align: right; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* Corgi rewards */
.pen { margin-top: 20px; padding-top: 16px; border-top: 2px dashed var(--line); }
.pen-title { margin-bottom: 8px; }
.slots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.slot { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--line); display: grid; place-items: center; }
.slot svg { width: 100%; height: 100%; display: block; }
.slot.has { background: transparent; }
.slot.pop svg { animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(0) rotate(-20deg); } to { transform: scale(1) rotate(0); } }
.reward { display: flex; align-items: center; gap: 12px; }
.reward svg { width: 54px; height: 54px; flex: none; animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
.kennel { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.kennel svg { width: 48px; height: 48px; }
.kennel .none { color: var(--muted); font-weight: 600; }

.trophy { text-align: center; margin: 4px 0 22px; padding: 18px 12px 12px; border-radius: 16px;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--glow) 32%, transparent), transparent 70%); }
.trophy svg { width: min(240px, 70%); height: auto; animation: rise .9s cubic-bezier(.3,1.5,.5,1); }
.trophy h3 { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; margin: 6px 0 0; text-wrap: balance; }
.trophy p { margin: 2px 0 0; color: var(--muted); font-weight: 600; }
@keyframes rise { from { transform: translateY(30px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
/* Theme picker */
.step { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; margin: 0 0 8px; }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
.theme {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px;
  background: var(--paper); color: var(--ink); border: 3px solid var(--line); border-radius: 16px;
  box-shadow: 0 4px 0 var(--line); font-family: var(--f-display); font-size: 1.1rem; min-width: 0;
}
.theme svg { width: 64px; height: 64px; }
.theme[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 4px 0 var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--paper)); }
.levels.off { opacity: .45; pointer-events: none; }
.need { font-size: .9rem; color: var(--muted); font-weight: 600; margin: 8px 0 0; }

.shelfrow { display: grid; grid-template-columns: 5.5em 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.shelfrow > b { font-family: var(--f-display); font-size: 1rem; }
.shelfrow .shelf { min-width: 0; }

/* Reward cartoon player */
.player { margin: 0 0 22px; border-radius: 16px; overflow: hidden; border: 3px solid var(--ink); background: #16131f; }
.stage { position: relative; }
.stage svg { display: block; width: 100%; height: auto; }
.cap { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: calc(100% - 20px); width: max-content;
  background: rgba(15, 12, 24, .72); color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 1rem; line-height: 1.2;
  padding: 4px 12px; border-radius: 10px; text-align: center; }
.big { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: rgba(22, 19, 31, .5); color: #fff; border-radius: 0; box-shadow: none; padding: 0; font-size: 1.2rem; }
.big:active { transform: none; }
.big .play { width: 70px; height: 70px; border-radius: 50%; background: var(--accent); display: grid; place-items: center;
  box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 35%, transparent); transition: transform .15s; }
.big:hover .play { transform: scale(1.08); }
.big .play::after { content: ""; margin-left: 6px; border-left: 22px solid #fff; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--paper); }
.bar button { font-size: .95rem; padding: 6px 12px; border-radius: 10px; box-shadow: none; }
.bar .pp { width: 44px; padding: 6px 0; }
.bar .snd { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); font-family: var(--f-body); font-weight: 800; font-size: .8rem; }
.track { flex: 1; min-width: 40px; height: 10px; border-radius: 5px; background: var(--line); cursor: pointer; overflow: hidden; }
.track:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.fill { height: 100%; width: 0; background: var(--accent); }
.time { font-size: .8rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { .time { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Cztery <span>działania</span></h1>
    <span class="chip" id="chip" hidden></span>
  </header>

  <section class="card" id="start">
    <p class="step">Krok 1</p>
    <h2>Wybierz temat naklejek</h2>
    <div class="themes" id="themes"></div>
    <p class="step">Krok 2</p>
    <h2>Wybierz poziom</h2>
    <div class="levels" id="levels"></div>
    <p class="need" id="need" hidden>Najpierw wybierz temat.</p>
    <div class="pen">
      <div class="pen-title">Twoje puchary</div>
      <div id="shelves"></div>
    </div>
  </section>

  <section class="card" id="quiz" hidden>
    <div class="progress" id="progress"></div>
    <div class="count" id="count">Zadanie 1 z 10</div>
    <div class="task" id="task" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <div class="row">
        <div class="inbox">
          <input id="answer" type="text" inputmode="numeric" aria-label="Twoja odpowiedź" placeholder="?">
        </div>
        <button type="submit" id="btn">Sprawdź</button>
      </div>
      <div class="err" id="err" hidden></div>
    </form>
    <div class="feedback" id="feedback" hidden aria-live="polite"></div>
    <div class="hint" id="hint"></div>
    <div class="pen">
      <div class="pen-title" id="penTitle">Twoje naklejki: 0</div>
      <div class="slots" id="slots"></div>
    </div>
  </section>

  <section class="card" id="report" hidden>
    <div class="count">Twój wynik</div>
    <div class="score" id="score"></div>
    <p class="msg" id="msg"></p>
    <div class="trophy" id="trophy" hidden></div>
    <div id="video"></div>
    <div class="pen-title" id="kennelTitle"></div>
    <div class="kennel" id="kennel"></div>
    <ul class="list" id="list"></ul>
    <div class="actions">
      <button type="button" id="again">Nowe zadania</button>
      <button type="button" class="ghost" id="change">Zmień temat lub poziom</button>
    </div>
  </section>
</div>

<script>
const N = 10;
const $ = id => document.getElementById(id);

// ---------- Sticker drawings (original, front-view faces, viewBox 0 0 100 100) ----------
const ART = {
  corgi: () => `<g stroke="#6b3a12" stroke-width="2" stroke-linejoin="round">
      <polygon points="16,50 21,4 47,33" fill="#e8913a"/><polygon points="84,50 79,4 53,33" fill="#e8913a"/></g>
    <polygon points="24,40 25,15 40,32" fill="#f6b5b5"/><polygon points="76,40 75,15 60,32" fill="#f6b5b5"/>

    <path d="M50 32 C44 44 41 54 34 66 C29 78 38 90 50 90 C62 90 71 78 66 66 C59 54 56 44 50 32 Z" fill="#fffaf2"/>
    <ellipse cx="27" cy="69" rx="6" ry="4" fill="#f59a9a" opacity=".55"/><ellipse cx="73" cy="69" rx="6" ry="4" fill="#f59a9a" opacity=".55"/>

    <path d="M50 74 Q50 80 44 81 M50 74 Q50 80 56 81" stroke="#2a1a10" stroke-width="2" fill="none" stroke-linecap="round"/>`,

    <circle cx="31" cy="56" r="4.4" fill="#2a1a22"/><circle cx="32.5" cy="54.6" r="1.4" fill="#fff"/>
    <circle cx="69" cy="56" r="4.4" fill="#2a1a22"/><circle cx="70.5" cy="54.6" r="1.4" fill="#fff"/>
    <path d="M36 67 Q50 79 64 67" stroke="#2a1a22" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
  cat: () => `<g stroke="#474a5c" stroke-width="2" stroke-linejoin="round">
      <polygon points="17,46 20,8 45,28" fill="#a9acbd"/><polygon points="83,46 80,8 55,28" fill="#a9acbd"/></g>
    <polygon points="24,38 25,17 38,29" fill="#f6b5b5"/><polygon points="76,38 75,17 62,29" fill="#f6b5b5"/>
    <ellipse cx="50" cy="60" rx="37" ry="30" fill="#a9acbd" stroke="#474a5c" stroke-width="2"/>
    <g stroke="#6f7285" stroke-width="3.2" stroke-linecap="round"><path d="M43 33 L45 43"/><path d="M50 31 L50 43"/><path d="M57 33 L55 43"/>
      <path d="M15 58 L24 60"/><path d="M85 58 L76 60"/></g>
    <ellipse cx="43" cy="73" rx="8" ry="6" fill="#f4f4f8"/><ellipse cx="57" cy="73" rx="8" ry="6" fill="#f4f4f8"/>
    <ellipse cx="36" cy="57" rx="5.5" ry="6.5" fill="#9bd46e" stroke="#474a5c" stroke-width="1.5"/><ellipse cx="36" cy="57" rx="1.8" ry="5" fill="#1d1d24"/>
    <ellipse cx="64" cy="57" rx="5.5" ry="6.5" fill="#9bd46e" stroke="#474a5c" stroke-width="1.5"/><ellipse cx="64" cy="57" rx="1.8" ry="5" fill="#1d1d24"/>
    <path d="M46 66 L54 66 L50 70 Z" fill="#ef8fa2"/>
    <path d="M50 70 Q50 75 45 76 M50 70 Q50 75 55 76" stroke="#474a5c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <g stroke="#474a5c" stroke-width="1.3" stroke-linecap="round"><path d="M35 72 L12 68"/><path d="M35 75 L13 78"/><path d="M65 72 L88 68"/><path d="M65 75 L87 78"/></g>`,
};

const THEMES = {
  corgi:   { name: 'Corgi',    acc: 'corgi',     plural: 'corgi',     cup: 'SUPER CORGI', title: 'Super Corgi',    tl: 96 },
  axolotl: { name: 'Aksolotl', acc: 'aksolotla', plural: 'aksolotle', cup: 'SUPER AKSOLOTL', title: 'Super Aksolotl', tl: 108 },
  cat:     { name: 'Kot',      acc: 'kota',      plural: 'koty',      cup: 'SUPER KOT', title: 'Super Kot',      tl: 76 },
};

const LEVELS = {
  easy: { name: 'Łatwy', bars: 1, color: 'var(--lv-easy)', desc: 'Małe liczby, np. 2 × 4 albo 12 + 5',
    cup: { name: 'Brązowy', a: '#a8622a', b: '#f3bd8a', c: '#8a4b1a', s: '#6e3a12', glow: '#e08a3c', plate: '#1f5c3e', stars: 1 } },
  mid: { name: 'Średni', bars: 2, color: 'var(--lv-mid)', desc: 'Średnie liczby, np. 7 × 8 albo 52 − 27',
    cup: { name: 'Srebrny', a: '#9aa3ad', b: '#f6f8fb', c: '#7f8893', s: '#56606b', glow: '#9fb4cc', plate: '#233c6b', stars: 2 } },
  hard: { name: 'Trudny', bars: 3, color: 'var(--lv-hard)', desc: 'Duże liczby, np. 17 × 9 albo 96 : 8',
    cup: { name: 'Złoty', a: '#d99a1e', b: '#ffe07a', c: '#c98712', s: '#a8700c', glow: '#f6c445', plate: '#3b2a55', stars: 3, crown: true } },
};

let theme = null, level = 'easy', tasks = [], i = 0, checked = false;

// ---------- Saved in this browser only ----------
function store(k, v) { try { localStorage.setItem(k, v); } catch {} }
function read(k) { try { return localStorage.getItem(k); } catch { return null; } }
function loadWins() {
  let w = {};

// ---------- Tasks: every number shown is at most 99; difficulty = size of the numbers ----------
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function addPair(lv) {
  if (lv === 'easy') return [rnd(2, 29), rnd(2, 9)];     // e.g. 12 + 5, 24 + 7
  if (lv === 'mid') return [rnd(10, 59), rnd(5, 42)];    // e.g. 34 + 18
  return [rnd(20, 99), rnd(20, 99)];                     // e.g. 67 + 58
}
function subPair(lv) {
  if (lv === 'easy') { const a = rnd(5, 35); return [a, rnd(1, Math.min(9, a - 1))]; }   // e.g. 17 − 4
  if (lv === 'mid') { const a = rnd(20, 89); return [a, rnd(5, a - 5)]; }                  // e.g. 52 − 27
  const a = rnd(40, 99); return [a, rnd(11, a - 5)];                                       // e.g. 93 − 48
}
function mulPair(lv) {
  if (lv === 'easy') return [rnd(2, 5), rnd(2, 9)];      // e.g. 2 × 4
  if (lv === 'mid') return [rnd(2, 12), rnd(2, 13)];     // e.g. 7 × 8
  return [rnd(11, 28), rnd(3, 9)];                       // e.g. 17 × 9
}
function divPair(lv) { // [quotient, divisor], dividend ≤ 99
  if (lv === 'hard') { const a = rnd(11, 33); return [a, rnd(2, Math.floor(99 / a))]; }   // e.g. 96 : 8
  let p; do { p = mulPair(lv); } while (p[0] * p[1] > 99); return p;
}
function makeTask(lv) {
  const op = rnd(0, 3);
  if (op === 2) { const [a, b] = addPair(lv); return { text: [a, '+', b], answer: a + b, label: `${a} + ${b}` }; }
  if (op === 3) { const [a, b] = subPair(lv); return { text: [a, '−', b], answer: a - b, label: `${a} − ${b}` }; }
  let [a, b] = op === 0 ? mulPair(lv) : divPair(lv);
  if (op === 0) { if (Math.random() < .5) [a, b] = [b, a]; return { text: [a, '×', b], answer: a * b, label: `${a} × ${b}` }; }
  const d = a * b;
  return { text: [d, ':', b], answer: a, label: `${d} : ${b}` };
}

      if (t < 6) { TF(k.glass, Math.max(240, 227 + w), 100); OP(k.glass, 1); }
      else if (t < 6.8) { const p = seg(t, 6, 6.8); TF(k.glass, 298 + 8 * p, 100 + 50 * p * p, 110 * p); OP(k.glass, 1); }
      else OP(k.glass, 0);
      const c = seg(t, 6.8, 8.6);
      OP(k.crash, t > 6.8 ? 1 : 0); TF(k.crash, 300, 150);
      OP(k.crashT, t > 6.8 && t < 8.6 ? 1 - c * c : 0); TF(k.crashT, 314, 132, -6, .7 + Math.min(1, c * 5) * .4);
      for (let i = 0; i < 3; i++) {
        const q = t - 10 - i * .4;
        OP(k['h' + i], q > 0 ? Math.max(0, 1 - q / 2) : 0);
        TF(k['h' + i], 62 + i * 14 + Math.sin(q * 4 + i) * 5, 86 - q * 26, 0, 1.2);
      }
    },
  },
};

// Little cartoon sound effects, only after the viewer presses play
let actx = null;
function sfx(kind) {
  if (!actx || !soundOn) return;
  const t0 = actx.currentTime, g = actx.createGain(); g.connect(actx.destination);
  const tone = (f0, f1, dur, type = 'sine', vol = .25) => {
    const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g); o.start(t0); o.stop(t0 + dur);
  };
  if (kind === 'boing') tone(320, 90, .5, 'triangle', .3);
  else if (kind === 'hop') tone(400, 800, .15);
  else if (kind === 'bonk') tone(160, 50, .25, 'square', .15);
  else if (kind === 'pop') tone(600, 1300, .09);
  else if (kind === 'crash') {
    const len = actx.sampleRate * .4, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = actx.createBufferSource(), hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
    src.buffer = buf; src.connect(hp); hp.connect(g); g.gain.value = .35; src.start(t0);
  }
}
let soundOn = true, player = null;

function mountPlayer(host, th) {
  if (player) player.stop();
  const S = SCENES[th];
  host.innerHTML = `
    <div class="player">
      <div class="stage">
        <svg viewBox="0 0 320 180" role="img" aria-label="Animowany filmik: ${THEMES[th].name}">${S.markup()}</svg>
        <div class="cap" aria-live="polite"></div>
        <button type="button" class="big"><span class="play" aria-hidden="true"></span><b>Obejrzyj filmik-nagrodę!</b></button>
      </div>
      <div class="bar">
        <button type="button" class="pp" aria-label="Odtwórz">▶</button>
        <div class="track" role="slider" aria-label="Postęp filmiku" aria-valuemin="0" aria-valuemax="${D}" tabindex="0"><div class="fill"></div></div>
        <span class="time">0:00 / 0:${D}</span>
        <button type="button" class="snd" aria-pressed="${soundOn}">Dźwięk: ${soundOn ? 'wł.' : 'wył.'}</button>
      </div>
    </div>`;
  const q = s => host.querySelector(s);
  const k = {}; host.querySelectorAll('[data-k]').forEach(el => k[el.dataset.k] = el);
  let t = 0, playing = false, last = 0, raf = 0, prev = 0;
  const draw = () => {
    S.update(t, k);
    let cap = ''; for (const [at, txt] of S.captions) if (t >= at) cap = txt;
    q('.cap').textContent = playing || t > 0 ? cap : '';
    q('.cap').hidden = !(playing || t > 0);
    q('.fill').style.width = (t / D * 100) + '%';
    q('.track').setAttribute('aria-valuenow', t.toFixed(1));
    q('.time').textContent = `0:${String(Math.floor(t)).padStart(2, '0')} / 0:${D}`;
    q('.pp').textContent = playing ? '❚❚' : '▶';
    q('.pp').setAttribute('aria-label', playing ? 'Pauza' : 'Odtwórz');
  };
  const loop = now => {
    if (!playing) return;
    t = Math.min(D, t + (now - last) / 1000); last = now;
    for (const [at, kind] of S.events) if (prev < at && t >= at) sfx(kind);
    prev = t;
    if (t >= D) { playing = false; q('.big b').textContent = 'Obejrzyj jeszcze raz!'; q('.big').hidden = false; }
    draw();
    if (playing) raf = requestAnimationFrame(loop);
  };
  const play = () => {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch { actx = null; }
    if (t >= D) { t = 0; prev = 0; }
    playing = true; q('.big').hidden = true; last = performance.now();
    raf = requestAnimationFrame(loop); draw();
  };
  const pause = () => { playing = false; cancelAnimationFrame(raf); draw(); };
  const seek = r => { t = cl(r) * D; prev = t; if (t < D) q('.big').hidden = true; draw(); };
  q('.big').addEventListener('click', play);
  q('.pp').addEventListener('click', () => playing ? pause() : play());
  q('.track').addEventListener('click', e => { const b = e.currentTarget.getBoundingClientRect(); seek((e.clientX - b.left) / b.width); });
  q('.track').addEventListener('keydown', e => { if (e.key === 'ArrowRight') seek((t + 1) / D); if (e.key === 'ArrowLeft') seek((t - 1) / D); });
  q('.snd').addEventListener('click', e => { soundOn = !soundOn; e.currentTarget.textContent = `Dźwięk: ${soundOn ? 'wł.' : 'wył.'}`; e.currentTarget.setAttribute('aria-pressed', soundOn); });
  draw();
  player = { stop: () => { playing = false; cancelAnimationFrame(raf); }, play, seek: s => { t = s; prev = s; draw(); } };
  return player;
}

// ---------- Screens ----------
function showStart() {
  if (player) player.stop();
  $('start').hidden = false; $('quiz').hidden = true; $('report').hidden = true; $('chip').hidden = true;
  $('themes').innerHTML = Object.entries(THEMES).map(([k, T]) => `
    <button type="button" class="theme" data-th="${k}" aria-pressed="${k === theme}">${sticker(k)}<span>${T.name}</span></button>`).join('');
  $('levels').innerHTML = Object.entries(LEVELS).map(([k, L]) => `
    <button type="button" class="level" data-lv="${k}" style="--lv:${L.color}">
      <span class="bars">${[1, 2, 3].map(n => `<i class="${n <= L.bars ? 'on' : ''}"></i>`).join('')}</span>
      <b>${L.name}</b><small>${L.desc}</small>
    </button>`).join('');
  $('levels').classList.toggle('off', !theme);
  $('need').hidden = !!theme;
  const wins = loadWins();
  $('shelves').innerHTML = Object.entries(THEMES).map(([th, T]) => `
    <div class="shelfrow"><b>${T.name}</b><div class="shelf">
      ${Object.entries(LEVELS).map(([lv, L]) => { const n = wins[th + '-' + lv] || 0; return `
        <div class="spot ${n ? '' : 'locked'}">${trophySvg(th, lv)}<div class="cap">${L.name}${n ? ` ×${n}` : ''}</div></div>`; }).join('')}
    </div></div>`).join('');
}

function pickTheme(th) { theme = th; store('theme', th); showStart(); }

function start(lv) {
  if (!theme) return;
  level = lv;
  const seen = new Set();
  tasks = [];
  while (tasks.length < N) {
    const t = makeTask(lv);
    if (seen.has(t.label)) continue;
    seen.add(t.label); tasks.push({ ...t, given: null, ok: null });
  }
  i = 0;
  const chip = $('chip');
  chip.textContent = `${THEMES[theme].name} · ${LEVELS[lv].name}`; chip.style.setProperty('--lv', LEVELS[lv].color); chip.hidden = false;
  $('hint').textContent = `Wpisz wynik i naciśnij Enter. Za każdą dobrą odpowiedź dostajesz naklejkę: ${THEMES[theme].acc}!`;
  $('start').hidden = true; $('report').hidden = true; $('quiz').hidden = false;
  show();
}

function show() {
  checked = false;
  const t = tasks[i];
  $('count').textContent = `Zadanie ${i + 1} z ${N}`;
  $('task').innerHTML = `<span>${t.text[0]}</span><span class="op">${t.text[1]}</span><span>${t.text[2]}</span><span class="op">=</span>`;
  $('answer').value = ''; $('answer').className = ''; $('answer').readOnly = false;
  $('feedback').hidden = true; $('err').hidden = true;
  $('btn').textContent = 'Sprawdź';
  drawProgress(); drawPen(false);
  $('answer').focus();
}

function drawProgress() {
  $('progress').innerHTML = tasks.map((t, k) =>
    `<div class="dot ${t.ok === true ? 'ok' : t.ok === false ? 'no' : k === i ? 'now' : ''}"></div>`).join('');
}

function drawPen(popLast) {
  const won = tasks.filter(t => t.ok).length;
  $('penTitle').textContent = `Twoje naklejki: ${won}`;
  $('slots').innerHTML = Array.from({ length: N }, (_, k) =>
    k < won ? `<div class="slot has${popLast && k === won - 1 ? ' pop' : ''}">${sticker()}</div>` : `<div class="slot"></div>`).join('');
}

function check() {
  const raw = $('answer').value.trim().replace(/\s/g, '');
  if (!/^\d+$/.test(raw)) {
    $('err').textContent = raw === '' ? 'Najpierw wpisz odpowiedź.' : 'Wpisz samą liczbę, np. 42.';
    $('err').hidden = false; $('answer').focus(); return;
  }
  const t = tasks[i];
  t.given = parseInt(raw, 10);
  t.ok = t.given === t.answer;
  checked = true;
  $('err').hidden = true; $('answer').readOnly = true;
  $('answer').className = t.ok ? 'ok' : 'no';
  const fb = $('feedback');
  fb.className = 'feedback ' + (t.ok ? 'ok' : 'no');
  if (t.ok) fb.innerHTML = `<div class="reward">${sticker()}<span>Dobrze! Dostajesz ${THEMES[theme].acc}!</span></div>`;
  else fb.textContent = `Niestety nie. Poprawny wynik to ${t.answer}.`;
  fb.hidden = false;
  $('btn').textContent = i < N - 1 ? 'Dalej →' : 'Zobacz wynik';
  drawProgress();
  if (t.ok) drawPen(true);
  $('btn').focus();
}

function next() { if (i < N - 1) { i++; show(); } else report(); }

function report() {
  const good = tasks.filter(t => t.ok).length, T = THEMES[theme], L = LEVELS[level];
  $('quiz').hidden = true; $('report').hidden = false;
  $('score').innerHTML = `${good}<small> / ${N}</small>`;
  const msg = good === 10 ? 'Perfekcyjnie! Wszystko dobrze!'
    : good >= 8 ? 'Świetna robota!'
    : good >= 6 ? 'Dobrze! Jeszcze trochę ćwiczeń.'
    : good >= 4 ? 'Nieźle, spróbuj jeszcze raz.'
    : 'Poćwicz jeszcze trochę i spróbuj ponownie.';
  $('msg').textContent = `${msg} Poprawnych odpowiedzi: ${good}, błędnych: ${N - good}.`;
  const tr = $('trophy');
  tr.hidden = good !== N;
  if (player) player.stop();
  $('video').innerHTML = '';
  if (good === N) {
    saveWin(theme, level);
    tr.style.setProperty('--glow', L.cup.glow);
    tr.innerHTML = `${trophySvg(theme, level)}<h3>${L.cup.name} puchar ${T.title}!</h3><p>Poziom ${L.name.toLowerCase()}, wszystkie 10 zadań bez błędu.</p>`;
    mountPlayer($('video'), theme);
  } else tr.innerHTML = '';
  $('kennelTitle').textContent = `Zdobyte naklejki: ${good}`;
  $('kennel').innerHTML = good ? Array.from({ length: good }, () => sticker()).join('')
    : '<span class="none">Tym razem bez naklejek. Spróbuj jeszcze raz!</span>';
  $('list').innerHTML = tasks.map(t => `
    <li class="${t.ok ? 'ok' : 'no'}">
      <span class="mark">${t.ok ? '✓' : '✗'}</span>
      <span class="eq">${t.label} = ${t.answer}</span>
      <span class="yours">${t.ok ? '' : 'Twoja: ' + t.given}</span>
    </li>`).join('');
  $('again').focus();
}

$('themes').addEventListener('click', e => { const b = e.target.closest('.theme'); if (b) pickTheme(b.dataset.th); });
$('levels').addEventListener('click', e => { const b = e.target.closest('.level'); if (b) start(b.dataset.lv); });
$('form').addEventListener('submit', e => { e.preventDefault(); checked ? next() : check(); });
$('again').addEventListener('click', () => start(level));
$('change').addEventListener('click', showStart);
const savedTheme = read('theme'); if (savedTheme && THEMES[savedTheme]) theme = savedTheme;
showStart();
</script>
